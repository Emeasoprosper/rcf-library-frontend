    <!-- iOS Safari doesn't support beforeinstallprompt or the web manifest's
         install flow — this trio is the only thing that makes "Add to Home
         Screen" launch fullscreen (no browser chrome) with a proper icon
         and status bar color, instead of opening as a bookmarked tab. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RCF Library" />

    <!-- No manual manifest <link> here on purpose. VitePWA injects its own
         <link rel="manifest" href="/manifest.webmanifest"> automatically at
         build/dev time. A hardcoded link to /site.webmanifest here would
         override VitePWA's generated one and point the browser at a stale
         manifest, breaking installability/icon detection. -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <body>
    <div id="root"></div>
    <!--
      Opening screen when the installed app starts: the logo (same place and
      background as the phone's own launch screen, so the switch is seamless)
      and "Powered by Aurenix" at the bottom. Shown only in the installed app,
      once per launch; main.jsx fades it out when the app is ready.
    -->
    <div id="boot-splash" aria-hidden="true">
      <img class="boot-logo" src="/brand/rcf-logo-dark.png" alt="" />
      <div class="boot-powered">
        <span>Powered by</span>
        <img src="/brand/aurenix-dark.png" alt="Aurenix" />
      </div>
    </div>
    <style>
      #boot-splash { display: none; position: fixed; inset: 0; z-index: 2147483000; background: #0A0A0A;
        flex-direction: column; align-items: center; justify-content: center; transition: opacity .35s ease; }
      #boot-splash.show { display: flex; }
      #boot-splash.hide { opacity: 0; pointer-events: none; }
      #boot-splash .boot-logo { width: min(46vw, 230px); height: auto; animation: boot-in .5s ease both; }
      #boot-splash .boot-powered { position: absolute; bottom: max(48px, calc(env(safe-area-inset-bottom) + 32px));
        display: flex; flex-direction: column; align-items: center; gap: 10px; animation: boot-in .6s .15s ease both; }
      #boot-splash .boot-powered span { font: 500 11px/1 Inter, system-ui, sans-serif; letter-spacing: .18em;
        text-transform: uppercase; color: #8a8f98; }
      #boot-splash .boot-powered img { height: 26px; width: auto; }
      @keyframes boot-in { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
      @media (prefers-reduced-motion: reduce) { #boot-splash .boot-logo, #boot-splash .boot-powered { animation: none } }
    </style>
    <script>
      ;(function () {
        var el = document.getElementById('boot-splash')
        var installed = window.matchMedia('(display-mode: standalone)').matches ||
          window.matchMedia('(display-mode: fullscreen)').matches || window.navigator.standalone === true
        var shown = false
        try { shown = sessionStorage.getItem('rcf_boot_splash') === '1'; sessionStorage.setItem('rcf_boot_splash', '1') } catch (e) {}
        if (!installed || shown) { el.parentNode.removeChild(el); return }
        el.className = 'show'
        window.__bootSplashAt = Date.now()
        window.__hideBootSplash = function () {
          if (!el.parentNode) return
          var wait = Math.max(0, 1300 - (Date.now() - window.__bootSplashAt))
          setTimeout(function () {
            el.className = 'show hide'
            setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el) }, 400)
          }, wait)
        }
        // Never stay stuck on it, whatever happens with the app.
        setTimeout(window.__hideBootSplash, 6000)
      })()
    </script>
    <script>
      // Self-repair. After an update, a phone can keep an old saved copy of
      // this page that points at app files which no longer exist, and the
      // app stays blank. If our own app code fails to load, or the app has
      // not started 8 seconds after the page loads, clear the saved copy
      // (service worker + caches) and reload once. Only while online, so the
      // offline library keeps working; at most once a minute, so it never loops.
      ;(function () {
        var KEY = 'rcf_self_heal_at'
        function heal() {
          if (!navigator.onLine) return
          try {
            if (Date.now() - Number(sessionStorage.getItem(KEY) || 0) < 60000) return
            sessionStorage.setItem(KEY, String(Date.now()))
          } catch (e) {}
          var jobs = []
          if ('serviceWorker' in navigator) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister() }))
            }))
          }
          if (window.caches) {
            jobs.push(caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k) }))
            }))
          }
          Promise.all(jobs).catch(function () {}).then(function () { location.reload() })
        }
        // Our own app files failing to load (not Google, fonts or other sites).
        window.addEventListener('error', function (e) {
          var t = e.target
          var src = t && (t.src || t.href)
          if (src && (t.tagName === 'SCRIPT' || t.tagName === 'LINK') && src.indexOf(location.origin + '/assets/') === 0) heal()
        }, true)
        window.addEventListener('vite:preloadError', function (e) { e.preventDefault(); heal() })
        window.addEventListener('load', function () {
          setTimeout(function () { if (!window.__rcfStarted) heal() }, 8000)
        })
      })()
    </script>
